services:
  db:
    image: mysql:8.0
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ugcd-django", "-pdb-gcd"]
      interval: 5s
      timeout: 3s
      # allow ~3 minutes: the very first mysql init can be slow, and
      # giving up here fails `up` where wait.sh used to loop
      retries: 30
      start_period: 30s
    ports:
      - '3308:3308'
    environment:
       MYSQL_DATABASE: 'my-gcd-db'
       MYSQL_USER: 'gcd-django'
       MYSQL_PASSWORD: 'db-gcd'
       MYSQL_ROOT_PASSWORD: 'root-password'
    volumes:
      - db:/var/lib/mysql
  web:
    build: .
    init: true
    command: python gcd-django/manage.py runserver 0.0.0.0:8000
    volumes:
      # Mount the checkout where the app runs so host edits trigger reloads.
      - ./gcd-django:/code/gcd-django
      # Some Windows checkouts materialize Git symlinks as plain text.
      - ./gcd-django/static/js/htmx_2_0_8.min.js:/code/gcd-django/static/js/htmx.min.js:ro
      # gcd-django gitignores settings_local.py, each installation brings
      # its own. This repo's checked-in copy holds the container settings,
      # so mount it into the checkout.
      - ./settings_local.py:/code/gcd-django/settings_local.py
    ports:
      - "8000:8000"
    environment:
      - MYSQL_DATABASE=my-gcd-db
      - MYSQL_USER=gcd-django
      - MYSQL_PASSWORD=db-gcd
      - MYSQL_ROOT_PASSWORD=root-password 
    depends_on:
      db:
        condition: service_healthy
volumes:
  db:
    driver: local
