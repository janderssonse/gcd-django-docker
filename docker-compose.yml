# Development environment for gcd-django.
services:
  db:
    image: mysql:8.0.46
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ugcd-django", "-pdb-gcd"]
      interval: 5s
      timeout: 3s
      # allow ~3 minutes: the very first mysql init can be slow, and
      # giving up here fails `up` where wait.sh used to loop
      retries: 30
      start_period: 30s
    ports:
      - '127.0.0.1:3308:3306'
    environment:
       MYSQL_DATABASE: 'my-gcd-db'
       MYSQL_USER: 'gcd-django'
       MYSQL_PASSWORD: 'db-gcd'
       MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
    volumes:
      - db:/var/lib/mysql
      - ./mysql-init.sql:/docker-entrypoint-initdb.d/mysql-init.sql:ro
  memcached:
    image: memcached:1.6.14-alpine
  web:
    build: .
    init: true
    command: python gcd-django/manage.py runserver 0.0.0.0:8000
    volumes:
      # GCD_CODE lets the mounted checkout live elsewhere, for example a
      # sibling directory: GCD_CODE=../gcd-django docker compose up
      # The build only reads ./gcd-django/requirements.txt, so with a
      # checkout elsewhere, copy that one file into place before building.
      - ${GCD_CODE:-./gcd-django}:/code/gcd-django
      - ./settings_local.py:/code/gcd-django/settings_local.py
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - MYSQL_DATABASE=my-gcd-db
      - MYSQL_USER=gcd-django
      - MYSQL_PASSWORD=db-gcd
      - USE_ELASTICSEARCH=${USE_ELASTICSEARCH:-}
    depends_on:
      db:
        condition: service_healthy
      memcached:
        condition: service_started
  es:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.26
    profiles: ["search"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"

volumes:
  db:
    driver: local
