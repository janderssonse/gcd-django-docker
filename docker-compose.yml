version: "3.13"
   
services:
  db:
    image: mysql:8.0
    ports:
      - '3308:3308'
    environment:
       MYSQL_DATABASE: 'my-gcd-db'
       MYSQL_USER: 'gcd-django'
       MYSQL_PASSWORD: 'db-gcd'
       MYSQL_ROOT_PASSWORD: 'root-password'
    volumes:
      - db:/var/lib/mysql
  web:
    build: .
    command: ./wait.sh
    volumes:
      # GCD_CODE lets the mounted checkout live elsewhere, for example a
      # sibling directory: GCD_CODE=../gcd-django docker compose up
      # Note the image build still reads ./gcd-django.
      - ${GCD_CODE:-./gcd-django}:/code/gcd-django
      - ./settings_local.py:/code/gcd-django/settings_local.py
    ports:
      - "8000:8000"
    environment:
      - MYSQL_DATABASE=my-gcd-db
      - MYSQL_USER=gcd-django
      - MYSQL_PASSWORD=db-gcd
      - MYSQL_ROOT_PASSWORD=root-password 
    depends_on:
      - db
volumes:
  db:
    driver: local
